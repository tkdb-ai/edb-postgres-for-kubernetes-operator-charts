#
# Default values for edb-database-cluster.
# This chart assumes the edb-postgres-for-kubernetes operator (and its CRDs)
# are already installed in the target cluster.
# This is a YAML-formatted file.
# Please declare variables to be passed to your templates.

nameOverride: ""
fullnameOverride: ""

# -- Name of the Cluster resource. Defaults to the chart's fullname if unset.
clusterName: ""

# -- Annotations to add to the Cluster resource.
clusterAnnotations: {}
# -- Labels to add to the Cluster resource.
clusterLabels: {}

cluster:
  # -- Human readable description of the cluster.
  description: "Example of cluster"
  # -- Container image to use for the PostgreSQL instances.
  imageName: docker.enterprisedb.com/k8s/postgresql:18.6-standard-ubi9
  # -- Number of instances in the cluster (1 primary + N-1 replicas).
  instances: 3
  # -- Seconds the operator waits for pods to become ready during startup.
  startDelay: 300
  # -- Seconds the operator waits for a clean shutdown.
  stopDelay: 300
  # -- Strategy used for rolling out image/configuration updates to the primary.
  # Can be "unsupervised" or "supervised".
  primaryUpdateStrategy: unsupervised

  postgresql:
    # -- postgresql.conf parameters applied to every instance.
    parameters:
      shared_buffers: 256MB
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      auto_explain.log_min_duration: "10s"
    # -- Additional pg_hba.conf rules appended after the ones generated by the operator.
    pg_hba:
      - host all all 10.244.0.0/16 md5

  bootstrap:
    initdb:
      # -- Name of the application database created at bootstrap time.
      database: app
      # -- Owner of the application database.
      owner: app

  # -- Enables access to the instances using the postgres superuser, via secrets.superuser.
  enableSuperuserAccess: true

  storage:
    # -- StorageClass used for the PGDATA volume. Leave empty to use the cluster default.
    storageClass: standard
    # -- Size of the PGDATA volume.
    size: 1Gi

  # -- Pod resource requests/limits for every instance.
  resources:
    requests:
      memory: "512Mi"
      cpu: "1"
    limits:
      memory: "1Gi"
      cpu: "2"

  affinity:
    # -- Spreads instances across nodes/zones using pod anti-affinity.
    enablePodAntiAffinity: true
    # -- Topology key used for the anti-affinity rule above.
    topologyKey: failure-domain.beta.kubernetes.io/zone

  nodeMaintenanceWindow:
    # -- Marks the cluster as being inside a planned node maintenance window.
    inProgress: false
    # -- Reuses the PVC instead of creating a new one when a node is drained.
    reusePVC: false

# -- Image pull secrets for the PostgreSQL image, only needed if cluster.imageName
# points to a private registry.
imagePullSecrets: []
# - name: private-registry-access

# -- CNPG-I plugins to register on the cluster. Enabled by default here
# with the cnpg-i-sidecar plugin (https://github.com/tkdb-ai/cnpg-i-sidecar).
# REQUIRED before this will actually work: the plugin's own controller
# must already be deployed separately (its own Deployment/Service, in the
# same namespace as the operator) - this only registers it on this
# Cluster, it doesn't deploy it. You almost certainly need to override
# parameters.image below with a real one - it's a placeholder. If the
# plugin controller isn't deployed at all, set plugins: [] instead, or
# Cluster creation may fail validation.
# parameters.configMapName must match sidecarScripts.name below (or its
# default) - this chart templates that ConfigMap for you, see
# sidecarScripts.
# See: https://cloudnative-pg.io/documentation/current/cnpg-i/
plugins:
- name: sidecar.tkdb.ai
  enabled: true
  parameters:
    image: supercronic-sidecar:latest
    configMapName: supercronic-scripts
    # command: "while true; do /etc/sidecar/run.sh; sleep 60; done"
    # env.LOG_LEVEL: debug

# -- The ConfigMap referenced by plugins[].parameters.configMapName above -
# holds the crontab and any scripts it invokes, mounted into the sidecar.
# If you install multiple Clusters from this chart in the same namespace
# without overriding sidecarScripts.name (and the matching
# plugins[].parameters.configMapName), they will collide on this name.
sidecarScripts:
  # -- Specifies whether this ConfigMap should be created. Set to false if
  # you manage it yourself outside this chart (e.g. shared across Clusters).
  create: true
  # -- Overrides the generated ConfigMap name. Must match whatever
  # plugins[].parameters.configMapName is set to. Defaults to
  # "supercronic-scripts".
  name: ""
  # -- Crontab file content, standard cron syntax. Script paths must match
  # plugins[].parameters.mountPath (default /etc/sidecar).
  crontab: |
    # minute hour day month weekday command
    */15 * * * * /etc/sidecar/vacuum-analyze.sh
  # -- Map of "filename: script content", mounted alongside the crontab.
  scripts:
    vacuum-analyze.sh: |
      #!/bin/sh
      set -eu
      psql -v ON_ERROR_STOP=1 -c "VACUUM (ANALYZE);"

logExport:
  # -- Creates a Role/RoleBinding granting this Cluster's own ServiceAccount
  # `get` on its own pods/log, for use by a sidecar script that needs to
  # pull Postgres's log via the Kubernetes API (e.g. the supercronic-sidecar
  # plugin's exportPath parameter) rather than reading CNPG's internal log
  # pipes directly, which cannot be read a second time or truncated.
  enabled: false

secrets:
  appUser:
    # -- Specifies whether the Secret with the application user credentials should be created.
    create: true
    # -- Overrides the generated Secret name. Defaults to "<fullname>-app-user".
    name: ""
    # -- Username for the application database owner.
    username: app
    # -- Password for the application database owner. Leave empty to auto-generate
    # a random password on install (preserved across upgrades).
    password: ""
  superuser:
    # -- Specifies whether the Secret with the postgres superuser credentials should be created.
    # Only relevant when cluster.enableSuperuserAccess is true.
    create: true
    # -- Overrides the generated Secret name. Defaults to "<fullname>-superuser".
    name: ""
    # -- Superuser username, normally "postgres".
    username: postgres
    # -- Password for the superuser. Leave empty to auto-generate a random
    # password on install (preserved across upgrades).
    password: ""

backup:
  # -- Enables barmanObjectStore backups on the cluster and creates the
  # backup credentials Secret below.
  enabled: false
  # -- Retention policy for base backups and WALs, e.g. "30d".
  retentionPolicy: "30d"
  barmanObjectStore:
    # -- Destination path (bucket/prefix) for the backups, e.g. s3://my-bucket/.
    destinationPath: ""
    # -- Custom S3-compatible endpoint URL. Leave empty to use AWS S3.
    endpointURL: ""
    wal:
      compression: gzip
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
      immediateCheckpoint: false
      jobs: 2
  credentials:
    # -- Specifies whether the Secret with the object store credentials should be created.
    create: true
    # -- Overrides the generated Secret name. Defaults to "<fullname>-backup-creds".
    name: ""
    # -- Access key ID for the object store.
    accessKeyId: ""
    # -- Secret access key for the object store.
    secretAccessKey: ""
