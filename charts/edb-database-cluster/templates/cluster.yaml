apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: {{ include "edb-database-cluster.clusterName" . }}
  labels:
    {{- include "edb-database-cluster.labels" . | nindent 4 }}
    {{- with .Values.clusterLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.clusterAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  description: {{ .Values.cluster.description | quote }}
  imageName: {{ .Values.cluster.imageName }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  instances: {{ .Values.cluster.instances }}
  startDelay: {{ .Values.cluster.startDelay }}
  stopDelay: {{ .Values.cluster.stopDelay }}
  primaryUpdateStrategy: {{ .Values.cluster.primaryUpdateStrategy }}

  postgresql:
    {{- with .Values.cluster.postgresql.parameters }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cluster.postgresql.pg_hba }}
    pg_hba:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.cluster.bootstrap.initdb.database }}
      owner: {{ .Values.cluster.bootstrap.initdb.owner }}
      secret:
        name: {{ include "edb-database-cluster.appUserSecretName" . }}

  enableSuperuserAccess: {{ .Values.cluster.enableSuperuserAccess }}
  {{- if .Values.cluster.enableSuperuserAccess }}
  superuserSecret:
    name: {{ include "edb-database-cluster.superuserSecretName" . }}
  {{- end }}

  storage:
    {{- with .Values.cluster.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
    size: {{ .Values.cluster.storage.size }}

  {{- if .Values.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ required "backup.barmanObjectStore.destinationPath is required when backup.enabled is true" .Values.backup.barmanObjectStore.destinationPath }}
      {{- with .Values.backup.barmanObjectStore.endpointURL }}
      endpointURL: {{ . }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ include "edb-database-cluster.backupSecretName" . }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ include "edb-database-cluster.backupSecretName" . }}
          key: ACCESS_SECRET_KEY
      wal:
        {{- toYaml .Values.backup.barmanObjectStore.wal | nindent 8 }}
      data:
        {{- toYaml .Values.backup.barmanObjectStore.data | nindent 8 }}
    retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  {{- end }}

  {{- with .Values.cluster.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cluster.nodeMaintenanceWindow }}
  nodeMaintenanceWindow:
    {{- toYaml . | nindent 4 }}
  {{- end }}
