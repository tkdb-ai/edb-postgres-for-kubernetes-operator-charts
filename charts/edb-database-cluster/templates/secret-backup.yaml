{{- if and .Values.backup.enabled .Values.backup.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edb-database-cluster.backupSecretName" . }}
  labels:
    {{- include "edb-database-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  ACCESS_KEY_ID: {{ required "backup.credentials.accessKeyId is required when backup.enabled is true" .Values.backup.credentials.accessKeyId | quote }}
  ACCESS_SECRET_KEY: {{ required "backup.credentials.secretAccessKey is required when backup.enabled is true" .Values.backup.credentials.secretAccessKey | quote }}
{{- end }}
