{{- if .Values.sidecarScripts.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edb-database-cluster.sidecarScriptsConfigMapName" . }}
  labels:
    {{- include "edb-database-cluster.labels" . | nindent 4 }}
data:
  crontab: |
    {{- .Values.sidecarScripts.crontab | nindent 4 }}
  {{- range $name, $content := .Values.sidecarScripts.scripts }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
