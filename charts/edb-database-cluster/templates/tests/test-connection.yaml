apiVersion: v1
kind: Pod
metadata:
  name: {{ include "edb-database-cluster.fullname" . }}-test-connection
  labels:
    {{- include "edb-database-cluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: test-connection
      image: busybox:stable
      command:
        - sh
        - -c
        - |
          echo "Checking {{ include "edb-database-cluster.clusterName" . }}-rw:5432 (primary, read-write)..."
          nc -z -w5 {{ include "edb-database-cluster.clusterName" . }}-rw 5432
          echo "Checking {{ include "edb-database-cluster.clusterName" . }}-ro:5432 (replicas, read-only)..."
          nc -z -w5 {{ include "edb-database-cluster.clusterName" . }}-ro 5432
          echo "Checking {{ include "edb-database-cluster.clusterName" . }}-r:5432 (any instance)..."
          nc -z -w5 {{ include "edb-database-cluster.clusterName" . }}-r 5432
          echo "All cluster services are reachable."
