{{- if .Values.logExport.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "edb-database-cluster.fullname" . }}-log-export
  labels:
    {{- include "edb-database-cluster.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "edb-database-cluster.fullname" . }}-log-export
  labels:
    {{- include "edb-database-cluster.labels" . | nindent 4 }}
subjects:
  # CNPG creates a ServiceAccount named after the Cluster itself for the
  # instance Pods, unless overridden - this chart doesn't currently expose
  # an override, so this is always the right name.
- kind: ServiceAccount
  name: {{ include "edb-database-cluster.clusterName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "edb-database-cluster.fullname" . }}-log-export
  apiGroup: rbac.authorization.k8s.io
{{- end }}
